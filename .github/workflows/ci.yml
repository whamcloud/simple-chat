name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install system deps (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go tools (protoc-gen-go, protoc-gen-go-grpc, golangci-lint)
        run: make install

      - name: Generate protobuf code
        run: make gen

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Unit + integration tests
        run: make test

      - name: Python version
        run: python3 --version

      - name: Smoke test (server + clients)
        run: make smoke