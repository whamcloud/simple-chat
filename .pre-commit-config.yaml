repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  - repo: local
    hooks:
      - id: rustfmt
        name: Rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        stages: [commit]

      - id: cargo-clippy
        name: Cargo clippy
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        pass_filenames: false
        stages: [commit]

      - id: cargo-build
        name: Cargo build
        entry: cargo build --workspace --all-features
        language: system
        pass_filenames: false
        stages: [commit]

      - id: cargo-test
        name: Cargo test
        entry: cargo test --workspace --lib
        language: system
        pass_filenames: false
        stages: [push]
