repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  - repo: local
    hooks:
      - id: rustfmt
        name: Rustfmt
        entry: bash -c 'if [ -f Cargo.toml ]; then cargo fmt --all; else exit 0; fi'
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
        stages: [pre-commit]

      - id: cargo-clippy
        name: Cargo clippy
        entry: bash -c 'if [ -f Cargo.toml ]; then cargo clippy --all-targets --all-features -- -D warnings; else exit 0; fi'
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
        stages: [pre-commit]

      - id: cargo-build
        name: Cargo build
        entry: bash -c 'if [ -f Cargo.toml ]; then cargo build --workspace --all-features; else exit 0; fi'
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
        stages: [pre-commit]

      - id: cargo-test
        name: Cargo test
        entry: bash -c 'if [ -f Cargo.toml ]; then cargo test --workspace --lib; else exit 0; fi'
        language: system
        pass_filenames: false
        files: \.(rs|toml)$
        stages: [pre-push]
