syntax = "proto3";

package chat.v1;

option go_package = "github.com/arunksaha/simple-chat/gen/chat/v1;chatv1";

// ChatService defines a bidirectional stream for real-time chat events.
service ChatService {
  // Chat accepts client events (join/send/leave) and emits server events.
  rpc Chat(stream ClientEvent) returns (stream ServerEvent);
}

// ClientEvent is the envelope for all events sent by the client.
message ClientEvent {
  oneof kind {
    // Join the chat session with a user identity.
    Join join = 1;
    // Send a chat message to other participants.
    Send send = 2;
    // Leave the current chat session.
    Leave leave = 3;
  }
}

// Join identifies the user starting a chat session.
message Join {
  string user_id = 1;
}

// Send contains plain text content from the client.
message Send {
  string text = 1;
}

// Leave signals the client is disconnecting intentionally.
message Leave {}

// ServerEvent is the envelope for all events emitted by the server.
message ServerEvent {
  oneof kind {
    // A user joined and should be reflected in client state.
    Joined joined = 1;
    // A chat message to display in the conversation.
    Message message = 2;
    // A server-side error the client should handle.
    Error error = 3;
  }
}

// Joined notifies clients that a user has entered the chat.
message Joined {
  string user_id = 1;
}

// Message is a chat payload distributed by the server.
message Message {
  // Sender's user identifier.
  string from_user_id = 1;
  // Message content.
  string text = 2;
  // Monotonic sequence number assigned by the server.
  uint64 seq = 3;
}

// Error reports a machine-readable code plus human-readable detail.
message Error {
  string code = 1;
  string detail = 2;
}
